<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Location Subscriber</title>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; }
        .container { max-width: 700px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        h1 { text-align: center; }
        .controls { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; border: none; color: white; border-radius: 4px; }
        #connectBtn { background-color: #28a745; }
        #disconnectBtn { background-color: #dc3545; }
        #log-container { margin-top: 20px; }
        #messages {
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            padding: 10px;
            white-space: pre-wrap; /* JSON 형식 유지 */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>차량 위치 실시간 구독</h1>
    <div class="controls">
        <label for="wsUrl">Server URL:</label>
        <input type="text" id="wsUrl" value="ws://localhost:8080/ws-location" size="30">
        <label for="groupId">Group ID:</label>
        <input type="text" id="groupId" placeholder="e.g., 7" size="5">
        <button id="connectBtn">Connect & Subscribe</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
    </div>

    <div id="log-container">
        <h3>수신된 메시지:</h3>
        <pre id="messages"></pre>
    </div>
</div>

<script>
    let stompClient = null;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const groupIdInput = document.getElementById('groupId');
    const wsUrlInput = document.getElementById('wsUrl');
    const messagesDiv = document.getElementById('messages');
    const jwtTokenInput = document.getElementById('jwtToken');

    function log(message) {
        messagesDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${message}\n\n`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function connect() {
        const groupId = groupIdInput.value;
        const wsUrl = wsUrlInput.value;

        if (!groupId || !wsUrl) {
            alert('Server URL과 Group ID를 모두 입력하세요.');
            return;
        }

        log("Connecting to WebSocket server...");

        // 1. 순수 WebSocket 객체를 생성합니다.
        const socket = new WebSocket(wsUrl);
        stompClient = Stomp.over(socket);

        // 2. STOMP 연결 시 헤더에 아무것도 전달하지 않습니다 (JWT 불필요).
        stompClient.connect({},
            function(frame) {
                log('✅ Connected: ' + frame);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;

                const topic = '/topic/group/' + groupId;
                log(`Subscribing to topic: ${topic}`);

                // 3. 그룹 토픽을 구독하여 메시지를 수신합니다.
                stompClient.subscribe(topic, function(message) {
                    log('🚀 Message received!');
                    const messageBody = JSON.parse(message.body);
                    // 수신된 JSON을 보기 좋게 출력합니다.
                    log(JSON.stringify(messageBody, null, 2));
                });
            },
            function(error) {
                log('❌ Connection failed: ' + error);
                // 연결 실패 시 버튼 상태 초기화
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        );
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
            log("🔌 Disconnected.");
        }
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
</script>

</body>
</html>
