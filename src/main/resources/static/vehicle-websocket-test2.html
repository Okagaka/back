<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Location Subscriber (JWT Auth)</title>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; }
        .container { max-width: 700px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        h1 { text-align: center; }
        .controls { margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; align-items: center; gap: 10px; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex-grow: 1; }
        button { padding: 8px 15px; cursor: pointer; border: none; color: white; border-radius: 4px; }
        #connectBtn { background-color: #28a745; }
        #disconnectBtn { background-color: #dc3545; }
        #log-container { margin-top: 20px; }
        #messages {
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>차량 위치 실시간 구독 (JWT 인증)</h1>
    <div class="controls">
        <div class="control-group">
            <label for="wsUrl">Server URL:</label>
            <input type="text" id="wsUrl" value="ws://localhost:8080/ws-location">
        </div>
        <!-- ✅ 1. Group ID 입력 대신 JWT Token 입력 UI로 변경 -->
        <div class="control-group">
            <label for="jwtToken">JWT Token:</label>
            <input type="text" id="jwtToken" placeholder="로그인 후 발급받은 JWT 토큰을 입력하세요">
        </div>
        <div>
            <button id="connectBtn">Connect & Subscribe</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
        </div>
    </div>

    <div id="log-container">
        <h3>수신된 메시지:</h3>
        <pre id="messages"></pre>
    </div>
</div>

<script>
    let stompClient = null;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const wsUrlInput = document.getElementById('wsUrl');
    const jwtTokenInput = document.getElementById('jwtToken');
    const messagesDiv = document.getElementById('messages');

    function log(message) {
        messagesDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${message}\n\n`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function connect() {
        const wsUrl = wsUrlInput.value;
        const token = jwtTokenInput.value;

        // ✅ 2. Group ID 대신 JWT Token 입력 여부 확인
        if (!wsUrl || !token) {
            alert('Server URL과 JWT Token을 모두 입력하세요.');
            return;
        }

        log("Connecting to WebSocket server with JWT...");

        const socket = new WebSocket(wsUrl);
        stompClient = Stomp.over(socket);

        // ✅ 3. connect 헤더에 'Authorization' 추가
        const headers = {
            'Authorization': 'Bearer ' + token
        };

        stompClient.connect(headers,
            function(frame) {
                log('✅ Connected: ' + frame);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;

                // ✅ 4. 개인화된 큐(queue)를 구독
                const userQueue = '/user/queue/location';
                log(`Subscribing to private queue: ${userQueue}`);

                stompClient.subscribe(userQueue, function(message) {
                    log('🚀 Message received!');
                    const messageBody = JSON.parse(message.body);
                    log(JSON.stringify(messageBody, null, 2));
                });
            },
            function(error) {
                log('❌ Connection failed: ' + error);
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        );
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
            log("🔌 Disconnected.");
        }
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
</script>

</body>
</html>
